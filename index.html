<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-Downloader | Premium Video Saver</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-animation"></div>
    
    <div class="glass-container">
        <header>
            <div class="logo">
                <i class="fas fa-bolt"></i>
                <h1>X-<span>Downloader</span></h1>
            </div>
            <p>TikTok & Instagram videolarını saniyələr içində yüklə</p>
        </header>

        <div class="search-box">
            <div class="input-wrapper">
                <i class="fas fa-link"></i>
                <input type="text" id="videoUrl" placeholder="Video linkini bura yapışdırın...">
            </div>
            <button id="downloadButton">
                <span>Axtar</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </div>
        
        <div id="statusMessage"></div>

        <div id="downloadResult">
            <!-- Kart buraya gələcək -->
        </div>

        <div class="features">
            <div class="feature"><i class="fas fa-check-circle"></i> Filiqransız</div>
            <div class="feature"><i class="fas fa-music"></i> Səs + Video</div>
            <div class="feature"><i class="fas fa-shield-alt"></i> Təhlükəsiz</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
