<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Səhifə Tapılmadı</title>
    <link rel="stylesheet" href="style.css"> <!-- Mövcud əsas stil faylın -->
    <link rel="stylesheet" href="404-style.css"> <!-- 404 üçün xüsusi stil -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="error-wrapper">
            <div class="error-icon">
                <i class="fas fa-ghost" id="ghostIcon"></i>
            </div>
            <h1 class="error-code">404</h1>
            <h2 class="error-title">Səhifə Tapılmadı</h2>
            <p class="error-desc">
                Görünür axtardığınız video və ya səhifə artıq mövcud deyil və ya ünvanı səhv daxil etmisiniz.
            </p>
            <div class="button-group">
                <a href="index.html" class="home-btn">
                    <i class="fas fa-home"></i> Ana Səhifə
                </a>
                <button onclick="goBack()" class="back-btn">
                    <i class="fas fa-arrow-left"></i> Geri Qayıt
                </button>
            </div>
        </div>
        
        <footer class="error-footer">
            <p>&copy; byParvan ; Video Yükləyici</p>
        </footer>
    </div>

    <script src="404-script.js"></script>
</body>
</html>
